name: Test Telegram bot
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile bot.py
      - name: Verify safe calculator
        run: |
          python - <<'PY'
          import ast, operator
          source = open('bot.py', encoding='utf-8').read()
          compile(source, 'bot.py', 'exec')
          assert 'ast.parse(expression, mode="eval")' in source
          assert 'filters.TEXT & ~filters.COMMAND' in source
          print('Static checks passed')
          PY
