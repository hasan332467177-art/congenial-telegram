services:
  - type: worker
    name: congenial-telegram-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: DEFAULT_TIMEZONE
        value: Asia/Tehran
      - key: ALERT_TIMES
        value: "08:00,17:00,21:30,02:45,11:45,17:45,03:30,17:00"
